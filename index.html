<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forza Rocks — Rock, punk &amp; metal radio from Forza Horizon</title>
  <meta name="description" content="Loud guitars, full throttle. The heavy radio stations of Forza Horizon, game by game, ready to play on YouTube.">
  <meta name="theme-color" content="#14151a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top-bar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open station list" aria-controls="drawer" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    </button>
    <a class="brand" href="#" aria-label="Forza Rocks home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9h2a7 7 0 0 1 14 0h2a9 9 0 0 0-9-9zm0 4a5 5 0 0 0-5 5h2a3 3 0 0 1 6 0h2a5 5 0 0 0-5-5zm0 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-1 4.5L9 21h6l-2-5.5z"/></svg>
      </span>
      <span class="brand-text">Forza <strong>Rocks</strong></span>
    </a>
    <span class="top-bar-tagline">Loud guitars, full throttle.</span>
  </header>

  <div class="layout">
    <nav class="drawer" id="drawer" aria-label="Games and radio stations">
      <div class="drawer-inner" id="stationNav"></div>
      <footer class="drawer-footer">
        <p>Fan-made index. Songs and videos belong to their respective owners.</p>
        <a href="https://github.com/thiago-bessa/forza-rocks" target="_blank" rel="noopener">View on GitHub</a>
      </footer>
    </nav>
    <div class="scrim" id="scrim" hidden></div>

    <main class="content" id="content" tabindex="-1">
      <section class="station-hero" id="hero" aria-live="polite"></section>

      <section class="track-card">
        <div class="track-toolbar">
          <label class="search-field">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
            <input type="search" id="filter" placeholder="Filter by band or song" autocomplete="off" aria-label="Filter by band or song">
          </label>
          <span class="track-count" id="trackCount"></span>
        </div>

        <div class="track-table" role="table" aria-label="Tracklist">
          <div class="track-row track-head" role="row">
            <span role="columnheader" class="col-num">#</span>
            <span role="columnheader" class="col-artist">Band</span>
            <span role="columnheader" class="col-title">Song</span>
            <span role="columnheader" class="col-link">Official video</span>
            <span role="columnheader" class="col-link">Live</span>
          </div>
          <div id="trackList" role="rowgroup"></div>
        </div>
        <p class="empty-state" id="emptyState" hidden>No songs match your filter.</p>
      </section>

      <p class="footnote">
        Links marked <span class="chip-inline">Search</span> open a YouTube search; direct video links can be added in <code>js/data.js</code>.
      </p>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
